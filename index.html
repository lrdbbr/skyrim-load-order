<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyrim Load Order Manager</title>
    <script>
      // Applique le thème persisté avant le premier rendu, pour éviter un
      // flash du thème par défaut le temps que React s'hydrate.
      ;(function () {
        try {
          var raw = localStorage.getItem('skyrim-load-order:theme')
          var theme = raw && JSON.parse(raw).state.theme
          var known = ['nordique', 'imperial', 'aurore', 'parchemin']
          if (known.indexOf(theme) !== -1) {
            document.documentElement.dataset.theme = theme
          }
        } catch (error) {
          // localStorage indisponible ou donnée corrompue : le thème par
          // défaut (variables :root) s'applique, sans bloquer le chargement.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
